# nginx for the lnshelf-client container (feature-spec §2, §9).
#
# Two jobs: serve the published Blazor WASM bundle, and proxy /api/* to the API
# container so the browser sees one origin. That is the whole reason there is no
# CORS configuration anywhere in the API's production path.
#
# Dropped in as /etc/nginx/conf.d/default.conf, so the image's own nginx.conf
# still provides the http block — including `include /etc/nginx/mime.types`
# (which carries application/wasm) and `default_type application/octet-stream`
# for Blazor's extensionless-to-nginx payload files. Declaring a `types` block
# here would replace that whole table rather than extend it, so we don't.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Cover overrides are capped at 8 MB by CoverStoreOptions.MaximumUploadBytes.
    # 10m leaves room for multipart overhead so an oversized upload is rejected by
    # the API — with a ProblemDetails the client can show — rather than by nginx.
    client_max_body_size 10m;

    # `dotnet publish` writes a .gz (and .br) sibling for every asset, so the
    # ~10 MB of framework payload ships pre-compressed and nginx never spends CPU
    # compressing it per request. Brotli would be smaller still, but ngx_brotli is
    # not compiled into nginx:alpine; the .br files simply go unread.
    gzip_static on;

    # Compression for what has no static sibling — chiefly the API's JSON.
    gzip           on;
    gzip_proxied   any;
    gzip_min_length 1024;
    gzip_types     application/json application/manifest+json text/css application/javascript image/svg+xml;

    # Fingerprinted filenames (OverrideHtmlAssetPlaceholders in the client csproj),
    # so a cached copy can never be the wrong copy. A deploy changes the names.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The one file that must not be cached: it names every fingerprinted asset.
    # try_files below redirects here internally, which re-runs location matching,
    # so deep links get this header too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The app's own stylesheets and script keep their names across deploys: a standalone
    # WASM publish fingerprints _framework/ on disk, but a #[.{fingerprint}] placeholder on
    # wwwroot content is rewritten to the plain name (checked against a Release publish),
    # because that fingerprint only exists as an ASP.NET endpoint, never as a file nginx
    # could serve. So these are revalidated instead — a 304 against the ETag costs nothing,
    # and a browser can no longer pair new markup with last week's CSS.
    location ~ ^/(css/[^/]+\.css|js/[^/]+\.js|LnShelf\.Client\.styles\.css)$ {
        add_header Cache-Control "no-cache";
    }

    # The API is only reachable through here — it publishes no host port. The
    # /api/ prefix the controllers are routed on ([Route("api/library")] and
    # friends) is passed through unchanged.
    location /api/ {
        # Docker's embedded DNS, and the upstream held in a variable so nginx
        # resolves it per request instead of once at startup. Two reasons: nginx
        # refuses to start at all if a literal upstream is unresolvable, and a
        # deploy that recreates only the api container gives it a new IP that a
        # startup-resolved upstream would keep 502-ing against.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream "http://api:8080";

        proxy_pass         $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Import and an on-demand sync wait on AniList, MangaUpdates and Open
        # Library, including rate-limit back-off. The default 60s read timeout
        # cuts those off mid-request.
        proxy_read_timeout 300s;
    }

    # SPA fallback: client-side routes like /series/42 are not files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
