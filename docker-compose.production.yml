# LnShelf production stack (feature-spec §9). Four services, one published port.
#
#   deploy.ps1 builds both images locally, ships them, and runs
#   `docker compose up -d --no-build` on the server against this file.
#
# The server also runs Hearth, which already owns host ports 8090, 5432, 9000,
# 9001 and 6379. Nothing here is published except the client on 8091 — postgres,
# minio and the API talk to each other over the compose network only, which is
# also what §2 asks for on its own merits.
name: lnshelf

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lnshelf
      POSTGRES_USER: lnshelf
      # Credentials come from a .env beside this file on the server (README.md,
      # Deploy), never from the repository. The :? form refuses to start without
      # them rather than falling back to a password everyone can read here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env next to docker-compose.yml}
    volumes:
      - lnshelf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lnshelf -d lnshelf"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cover storage behind ICoverStore. The bucket is created by MinioCoverStore on
  # first use, so a cold start needs no provisioning step.
  # Pinned (not :latest): this bucket holds cached covers and the user's cover
  # overrides — an unannounced breaking MinIO release must never land silently.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lnshelf
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the .env next to docker-compose.yml}
    volumes:
      - lnshelf-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pinned image tag: deploy.ps1 builds and ships this tag, then runs
  # `up -d --no-build` to consume it. The build block is only for a local
  # `docker compose -f docker-compose.production.yml build` — the server has no
  # source tree.
  api:
    image: lnshelf-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Db: "Host=postgres;Port=5432;Database=lnshelf;Username=lnshelf;Password=${POSTGRES_PASSWORD}"
      # Covers:* binds to CoverStoreOptions. Endpoint is S3 style — host and port,
      # no scheme; UseSsl carries the scheme instead.
      Covers__Endpoint: "minio:9000"
      Covers__UseSsl: "false"
      Covers__AccessKey: "lnshelf"
      Covers__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Covers__Bucket: "lnshelf-covers"
      # The nightly sweep is the reason this is deployed at all, so unlike
      # development it is on. Hour is local time, hence TZ — the container would
      # otherwise be UTC and sync at 06:00 local in summer.
      Sync__Enabled: "true"
      Sync__Hour: "4"
      TZ: "Europe/Copenhagen"
      # Optional. Open Library asks API users for a contact address in the User-Agent;
      # empty sends the anonymous one (LnShelfUserAgent).
      OpenLibrary__ContactEmail: "${OPENLIBRARY_CONTACT_EMAIL:-}"
      # Login (feature-spec §7): the OpenID Connect client registered with the provider,
      # and the one address allowed in. All three are required; the API refuses to start
      # without them. AUTH_AUTHORITY defaults to Google.
      Auth__Authority: "${AUTH_AUTHORITY:-https://accounts.google.com}"
      Auth__ClientId: "${AUTH_CLIENT_ID:?Set AUTH_CLIENT_ID in the .env next to docker-compose.yml}"
      Auth__ClientSecret: "${AUTH_CLIENT_SECRET:?Set AUTH_CLIENT_SECRET in the .env next to docker-compose.yml}"
      Auth__AllowedEmail: "${AUTH_ALLOWED_EMAIL:?Set AUTH_ALLOWED_EMAIL in the .env next to docker-compose.yml}"
    # No healthcheck: the aspnet runtime image ships no curl or wget, and adding
    # one to the image to satisfy compose is not worth it. deploy.ps1 polls
    # /api/library through the client instead, which proves more anyway.

  # The only public face: nginx serves the WASM bundle and proxies /api/* to the
  # API, so the browser sees one origin and the API needs no CORS (§2).
  client:
    image: lnshelf-client:latest
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8091:80"

  # HTTPS in front of the client, through a Cloudflare Tunnel (README.md, Deploy). Login
  # needs it: Google only redirects to https:// hosts. The tunnel is created in the
  # Cloudflare dashboard with a public hostname pointing at http://client:80, and its
  # token goes in the .env. Off unless COMPOSE_PROFILES=tunnel, so the stack still runs
  # on the plain port without one. Outbound only: nothing is opened on the router.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Not :? like the others: compose interpolates every service, profile or not, so a
      # required variable here would stop the stack without a tunnel from starting.
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      - client

volumes:
  lnshelf-pgdata:
  lnshelf-minio:
