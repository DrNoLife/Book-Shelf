# LnShelf production stack (feature-spec §9). Three services, one published port.
#
#   deploy.ps1 builds both images locally, ships them, and runs
#   `docker compose up -d --no-build` on the server against this file.
#
# The server also runs Hearth, which already owns host ports 8090, 5432, 9000,
# 9001 and 6379. Nothing here is published except the client on 8091 — postgres
# and the API talk to each other over the compose network only, which is
# also what §2 asks for on its own merits.
name: lnshelf

# Container logs are rotated: three files of 10 MB per service, then the oldest goes. nginx's
# access log records visitor IPs, user agents and share-link URLs, and the daemon's default is
# no limit at all, so without this they would be kept until the container is recreated. This is
# what the privacy page's "rotated automatically by size" rests on (docs/privacy-record.md).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: lnshelf
      POSTGRES_USER: lnshelf
      # Credentials come from a .env beside this file on the server (README.md,
      # Deploy), never from the repository. The :? form refuses to start without
      # them rather than falling back to a password everyone can read here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env next to docker-compose.yml}
    volumes:
      - lnshelf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lnshelf -d lnshelf"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pulled by digest from GHCR, never by a tag: a tag can be moved by anything that can
  # push, a digest names exactly the bytes the release workflow built, scanned and
  # attested. The deploy script (ops/deploy/lnshelf-deploy) sets both digests from the
  # release; the deploy gate refuses a compose file that does not use them. The build
  # block is only for a local `docker compose -f docker-compose.production.yml build`.
  api:
    image: ghcr.io/drnolife/lnshelf-api@${LNSHELF_API_DIGEST:?Deploy through ops/deploy/lnshelf-deploy, which sets the image digests}
    build:
      context: .
      dockerfile: Dockerfile.api
      # The Six Labors license key for ImageSharp, read from the SixLaborsLicenseKey
      # environment variable of whoever runs the build. A BuildKit secret, so it is not
      # baked into the image (README.md, Deploy).
      secrets:
        - sixlabors_license
    restart: unless-stopped
    logging: *default-logging
    # Decoding cover images is the API's one large allocation (up to the 40-megapixel
    # cap, about 160 MB per image). The ceiling keeps a bad image or a leak from
    # starving Postgres and the other stacks on the shared host; the .NET GC reads it
    # from the cgroup and sizes its heap to fit.
    mem_limit: 1g
    volumes:
      - lnshelf-covers:/data/covers
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Db: "Host=postgres;Port=5432;Database=lnshelf;Username=lnshelf;Password=${POSTGRES_PASSWORD}"
      # Covers live in the lnshelf-covers volume at /data/covers, the store's default
      # (FileSystemCoverStoreOptions), so nothing needs setting here.
      # The nightly sweep is the reason this is deployed at all, so unlike
      # development it is on. Hour is local time, hence TZ — the container would
      # otherwise be UTC and sync at 06:00 local in summer.
      Sync__Enabled: "true"
      Sync__Hour: "4"
      TZ: "Europe/Copenhagen"
      # Optional. Uptime Kuma's push URL for the nightly sync (ops/uptime-kuma); the sync
      # beats up or down when it ends, and Kuma alerts on a down beat or a missing one.
      # It carries the push token, so it lives in the .env.
      Heartbeat__Monitors__NightlySync: "${HEARTBEAT_NIGHTLY_SYNC_URL:-}"
      # Optional. Open Library asks API users for a contact address in the User-Agent;
      # empty sends the anonymous one (LnShelfUserAgent).
      OpenLibrary__ContactEmail: "${OPENLIBRARY_CONTACT_EMAIL:-}"
      # Login (feature-spec §7): the OpenID Connect client registered with the provider.
      # Both are required; the API refuses to start without them. AUTH_AUTHORITY defaults
      # to Google. Anyone with a verified address may sign up and gets their own shelf.
      # AUTH_INITIAL_OWNER_EMAIL is the address that takes over the library that existed
      # before users did, on its first sign-in.
      Auth__Authority: "${AUTH_AUTHORITY:-https://accounts.google.com}"
      Auth__ClientId: "${AUTH_CLIENT_ID:?Set AUTH_CLIENT_ID in the .env next to docker-compose.yml}"
      Auth__ClientSecret: "${AUTH_CLIENT_SECRET:?Set AUTH_CLIENT_SECRET in the .env next to docker-compose.yml}"
      Auth__InitialOwnerEmail: "${AUTH_INITIAL_OWNER_EMAIL:-}"
    # No healthcheck: the aspnet runtime image ships no curl or wget, and adding
    # one to the image to satisfy compose is not worth it. deploy.ps1 polls
    # /api/library through the client instead, which proves more anyway.

  # The only public face: nginx serves the WASM bundle and proxies /api/* to the
  # API, so the browser sees one origin and the API needs no CORS (§2).
  client:
    image: ghcr.io/drnolife/lnshelf-client@${LNSHELF_CLIENT_DIGEST:?Deploy through ops/deploy/lnshelf-deploy, which sets the image digests}
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    ports:
      - "8091:80"

  # HTTPS comes from a Cloudflare Tunnel that runs as its own compose project
  # (ops/cloudflared), not here: a deploy runs `up` on this project and must never be
  # able to recreate the tunnel its own SSH session arrives through.

# Build-time only; no service mounts it at runtime.
secrets:
  sixlabors_license:
    environment: SixLaborsLicenseKey

volumes:
  lnshelf-pgdata:
  lnshelf-covers:
