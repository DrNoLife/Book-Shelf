# Uptime Kuma: watches LnShelf and alerts to Discord (ops/uptime-kuma/README.md). Lives on the
# server in ~/docker/uptime-kuma, next to a .env holding KUMA_BIND_ADDRESS.
#
# LAN only. It is never added to the Cloudflare tunnel: its dashboard holds the push tokens and
# the Discord webhook, and it has no business being on the internet.
name: uptime-kuma

# Same rotation as the lnshelf stack: three files of 10 MB, then the oldest goes.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  uptime-kuma:
    # Pinned by tag and digest, so a re-pushed tag cannot change what runs here.
    image: louislam/uptime-kuma:2.5.6@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329
    restart: unless-stopped
    logging: *default-logging
    # Bound to the server's LAN address only. Docker's published ports bypass ufw, so the bind
    # address is what keeps it off every other interface.
    ports:
      - "${KUMA_BIND_ADDRESS:?Set KUMA_BIND_ADDRESS to the server's LAN address in the .env next to compose.yml}:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  uptime-kuma-data:
