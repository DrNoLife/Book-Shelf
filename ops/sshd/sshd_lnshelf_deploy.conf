# A second sshd for the deploy path only (ops/sshd/README.md). Installed by hand at
# /etc/ssh/sshd_lnshelf_deploy.conf and run by lnshelf-deploy-sshd.service.
#
# It is a separate daemon rather than a Match block in the normal sshd_config, so the owner's
# own keys and the normal sshd are never reachable through the Cloudflare tunnel, and the deploy
# key never works against the normal sshd. Nothing from /etc/ssh/sshd_config or its .d directory
# is included: every setting this daemon has is in this file.

# Only on the docker bridge gateway: the tunnel container reaches it as host.docker.internal.
# Not on the LAN, not on localhost. Check the address with `ip -4 addr show docker0`.
ListenAddress 172.17.0.1
Port 2222
AddressFamily inet

# Its own host key, so DEPLOY_KNOWN_HOSTS pins a key used for nothing else.
HostKey /etc/ssh/lnshelf_deploy_host_ed25519_key
HostKeyAlgorithms ssh-ed25519
PidFile /run/sshd-lnshelf-deploy.pid

# One account, one root-owned key file, public key only.
AllowUsers neko
AuthorizedKeysFile /etc/ssh/lnshelf_deploy_keys
AuthorizedPrincipalsFile none
AuthenticationMethods publickey
PubkeyAuthentication yes
PubkeyAcceptedAlgorithms ssh-ed25519
PasswordAuthentication no
KbdInteractiveAuthentication no
HostbasedAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
StrictModes yes
# No PAM: nothing here needs a login session, limits or a message of the day, and fewer
# modules is less to go wrong. (Without PAM, sshd refuses accounts whose password is locked.)
UsePAM no

# Whatever the client asks for, the gate runs. It accepts two commands and nothing else.
ForceCommand /usr/local/sbin/lnshelf-deploy-gate
PermitTTY no
PermitUserEnvironment no
PermitUserRC no
DisableForwarding yes
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitListen none
PermitOpen none

# A deploy is one short command and a status poll every ten seconds.
MaxAuthTries 2
MaxSessions 1
MaxStartups 4:50:10
LoginGraceTime 20
ClientAliveInterval 30
ClientAliveCountMax 4

PrintMotd no
PrintLastLog no
Banner none
Compression no
# VERBOSE logs the fingerprint of the key behind every login, to the auth log.
SyslogFacility AUTH
LogLevel VERBOSE
