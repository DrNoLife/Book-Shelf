# Local infrastructure only. The api and client containers arrive in phase 6
# (feature-spec §9); in development the API runs via `dotnet run` and the client
# via the WASM dev server, both against these two services.
services:

  postgres:
    image: postgres:17-alpine
    container_name: lnshelf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lnshelf
      POSTGRES_USER: lnshelf
      # Local development credentials only. Production supplies these through
      # the environment (§9) — nothing secret belongs in this file.
      POSTGRES_PASSWORD: lnshelf
    # 5433 on the host: 5432 is usually already taken by another local Postgres.
    # Inside the compose network the port is still the standard 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lnshelf -d lnshelf"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cover storage sits behind ICoverStore and MinIO is its first implementation.
  # Wired up here so the dev environment matches the deployed one; no code
  # touches it until phase 2's cover cache.
  # Pinned (not :latest): this bucket holds cached covers and the user's cover
  # overrides — an unannounced breaking MinIO release must never land silently.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lnshelf-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lnshelf
      MINIO_ROOT_PASSWORD: lnshelf-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  minio:
