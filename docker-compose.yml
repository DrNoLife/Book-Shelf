# Local infrastructure only: Postgres. In development the API runs via `dotnet run` and the
# client via the WASM dev server. Covers need no service; the API keeps them in a folder
# (Covers:FileSystem:RootPath, .data/covers under the API project in development).
services:

  postgres:
    image: postgres:17.11-alpine
    container_name: lnshelf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lnshelf
      POSTGRES_USER: lnshelf
      # Local development credentials only. Production supplies these through
      # the environment (§9) — nothing secret belongs in this file.
      POSTGRES_PASSWORD: lnshelf
    # 5433 on the host: 5432 is usually already taken by another local Postgres.
    # Inside the compose network the port is still the standard 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lnshelf -d lnshelf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
