# Security headers, included at server level and again in every location that declares its
# own add_header: nginx does not inherit add_header into a location that defines one.
#
# No Strict-Transport-Security here on purpose: Cloudflare adds it, and the plain-HTTP LAN
# port must keep working.
#
# The importmap hash is stamped in by Dockerfile.client: the inline <script type="importmap">
# in index.html lists the fingerprinted framework files, so its content changes every
# publish. Login is a top-level navigation to /api/auth/login, never a form post, so
# form-action only needs 'self'. style-src keeps 'unsafe-inline' for style="" attributes only.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy $referrer_policy always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-__IMPORTMAP_SHA256__'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
