<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LN Shelf</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Fonts are vendored into wwwroot/fonts; nothing is fetched from a CDN. -->
    <link rel="preload" href="fonts/manrope-400-700-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/instrument-serif-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="LnShelf.Client.styles.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">Loading the shelf…</div>
    </div>

    <!-- The template's dismiss 🗙 is not wired to anything in a WASM app, so it is not
         shipped: a control that does nothing is worse than no control. -->
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <!-- The volume grid's two unavoidable interop calls: reading the rendered column
         count, and moving focus between tiles. -->
    <script src="js/lnshelf.js"></script>
</body>

</html>
